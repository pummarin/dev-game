  <rect width="2000" height="1300" fill="#e9e4d8"/>
  <text x="55" y="55" font-family="sans-serif" font-size="34" font-weight="700" fill="#26342f">Frontier Town — actual source proportion review</text>
  <text x="55" y="90" font-family="sans-serif" font-size="20" fill="#44524c">Source pixels cropped to alpha ≥128 bounds; all props use one uniform scale. 1H = visible player height.</text>
  <text x="55" y="122" font-family="sans-serif" font-size="19" fill="#44524c">Current project display: player frame 92×138 px; visible body 60.6×121.0 px, so 1H = 121 px. Sprite ratios preserved.</text>
